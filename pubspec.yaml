name: chomu
description: Interactive 3D AI Companion for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 3D / WebView
  flutter_inappwebview: ^6.0.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # File & Permissions
  file_picker: ^8.1.2
  permission_handler: ^11.3.1

  # Networking
  http: ^1.2.2
  dio: ^5.7.0

  # Audio / TTS / STT
  flutter_tts: ^4.2.5
  audioplayers: ^6.1.0
  record: ^5.1.2
  speech_to_text: ^6.6.2

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  json_annotation: ^4.9.0
  logger: ^2.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  json_serializable: ^6.8.0

dependency_overrides:
  record_linux:
    path: local_packages/record_linux

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/html/
